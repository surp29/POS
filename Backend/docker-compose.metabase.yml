services:
  metabase:
    image: metabase/metabase:latest
    container_name: pos_metabase
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pos_network

volumes:
  metabase_data:
    driver: local

networks:
  pos_network:
    driver: bridge
